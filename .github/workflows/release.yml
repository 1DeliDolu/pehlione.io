name: Release

on:
  push:
    tags:
      - 'v*' # Run on version tags, e.g. v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute BASE_PATH
        id: base
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY%/*}"
          if [ -f public/CNAME ] && [ -s public/CNAME ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          elif [ "$REPO_NAME" = "${OWNER_NAME}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Pack dist
        run: |
          cd dist
          zip -r ../mustafa_portfoli.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: mustafa_portfoli.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Generate conventional release notes
        run: |
          npx --yes conventional-changelog-cli -p conventionalcommits -r 1 -o RELEASE_NOTES.md
          echo "Generated notes:" && head -n 50 RELEASE_NOTES.md || true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: .

      - name: Create Release and upload artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            mustafa_portfoli.zip
